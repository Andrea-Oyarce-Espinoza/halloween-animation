<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween Magic</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="scene">
        <h1>Halloween Magic 🎃</h1>
        <p>Click the pumpkin for a spooky surprise!</p>

        <div class="moon"></div>
        
        <!-- Flying witch -->
         <div class="witch-flight" aria-label="Flying witch">
            <div class="witch">
                <div class="witch-hat">
                    <div class="hat-tip"></div>
                    <div class="hat-brim"></div>
                    <div class="hat-buckle"></div>
                </div>

                <div class="witch-hair"></div>
                <div class="witch-face">
                    <div class="witch-eye"></div>
                    <div class="witch-nose"></div>
                </div>

                <div class="witch-body"></div>
                <div class="witch-arm"></div>
                <div class="witch-broom">
                    <div class="broom-bristles"></div>
                </div>
            </div>
         </div>

        <div class="bat bat-one">🦇</div>
        <div class="bat bat-two">🦇</div>

        <div class="ghost">
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="mouth"></div>
        </div>

        <button class="pumpkin" id="pumpkin"
                aria-label="Surprise pumpkin">
            <span class="stem"></span>
            <span class="pumpkin-eye left"></span>
            <span class="pumpkin-eye right"></span>
            <span class="pumpkin-mouth"></span>
        </button>

        <!-- Twinkling stars -->
         <div class="stars" id="stars" aria-hidden="true"></div>

         <!-- Haunted house -->
          <div class="haunted-house" aria-hidden="true">
            <div class="house-roof"></div>
            <div class="house-body">
                <div class="house-window window-left"></div>
                <div class="house-window window-right"></div>
                <div class="house-door"></div>
            </div>
          </div>

          <!-- Spooky trees -->
           <div class="tree tree-left" aria-hidden="true">
            <div class="tree-trunk"></div>
            <div class="branch branch-one"></div>
            <div class="branch branch-two"></div>
            <div class="branch branch-three"></div>
           </div>

           <div class="tree tree-right" aria-hidden="true">
            <div class="tree-trunk"></div>
            <div class="branch branch-one"></div>
            <div class="branch branch-two"></div>
            <div class="branch branch-three"></div>
           </div>

           <!-- Graveyard -->
            <div class="graveyard" aria-hidden="true">
                <div class="grave grave-one"></div>
                <div class="grave grave-two"></div>
                <div class="grave grave-three"></div>
                <div class="grave grave-four"></div>
            </div>

            <div class="ground"></div>

        <div id="surprise" aria-live="polite"></div>
    </main>
</body>
</html>
